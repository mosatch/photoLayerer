name: PhotoLayerer
options:
  bundleIdPrefix: org.barryfamily
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  PhotoLayerer:
    type: application
    platform: macOS
    sources:
      - path: Sources/PhotoLayerer
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: PhotoLayerer
        CFBundleDisplayName: PhotoLayerer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.photography
        CFBundleIconFile: PhotoLayerer
        NSPhotoLibraryUsageDescription: PhotoLayerer reads photos from your library so you can open them or add them as layers.
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Photoshop Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.photoshop-image]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.heic, public.tiff, public.image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.adobe.photoshop-image
            UTTypeDescription: Adobe Photoshop document
            UTTypeConformsTo: [public.image, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [psd]
              public.mime-type: [image/vnd.adobe.photoshop]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.barryfamily.photolayerer
        PRODUCT_NAME: PhotoLayerer
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Support/PhotoLayerer.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  PhotoLayererTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PhotoLayererTests
    dependencies:
      - target: PhotoLayerer
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PhotoLayerer.app/Contents/MacOS/PhotoLayerer
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  PhotoLayerer:
    build:
      targets:
        PhotoLayerer: all
        PhotoLayererTests: [test]
    test:
      targets: [PhotoLayererTests]
